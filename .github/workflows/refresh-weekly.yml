name: Weekly OSSRank refresh

on:
  schedule:
    - cron: '17 18 * * 4'
  workflow_dispatch:
    inputs:
      limit:
        description: Candidates per shard
        required: false
        default: '20'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify required refresh/deploy secrets are configured
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          missing=0
          for secret_name in OSSRANK_GITHUB_TOKEN CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!secret_name}" ]; then
              echo "::error::Required repository secret ${secret_name} is not configured."
              missing=1
            fi
          done
          exit "$missing"
      - name: Confirm GitHub PAT can access GraphQL search
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
        run: pnpm exec tsx src/cli.ts token-check --require-graphql-search
      - name: Refresh OSSRank snapshots with live GitHub collector
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
          OSSRANK_LIMIT: ${{ inputs.limit || '20' }}
        run: pnpm run refresh:live
      - run: pnpm run validate:data
      - run: pnpm run build
      - name: Push data to branch and create PR
        env:
          GH_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date +%Y-%m-%d)
          BRANCH="data/weekly-refresh-${DATE}"
          git checkout -B "${BRANCH}"
          git add data
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: refresh ossrank live snapshots (${DATE})"
          git push origin "${BRANCH}" --force
          PR_NUMBER=$(gh pr view "${BRANCH}" --json number --jq .number 2>/dev/null || true)
          if [ -n "${PR_NUMBER}" ]; then
            gh pr edit "${PR_NUMBER}" \
              --title "data: weekly ossrank live refresh (${DATE})" \
              --body "Automated weekly OSSRank data refresh (updated)."
          else
            echo "No existing PR found for ${BRANCH}; creating one."
            gh pr create \
              --head "${BRANCH}" \
              --base main \
              --title "data: weekly ossrank live refresh (${DATE})" \
              --body "Automated weekly OSSRank data refresh. Review and merge."
          fi
      - name: Deploy refreshed site to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy dist --project-name ossrank
