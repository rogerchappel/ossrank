name: Weekly OSSRank refresh

on:
  schedule:
    - cron: '17 18 * * 4'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm GitHub token is available
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN || github.token }}
        run: pnpm exec tsx src/cli.ts token-check
      - name: Refresh OSSRank snapshots with CLI pipeline
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN || github.token }}
        run: pnpm run refresh:fixtures
      - run: pnpm run validate:data
      - run: pnpm run build
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: refresh ossrank snapshots'
          file_pattern: 'data dist'
