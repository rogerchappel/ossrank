name: Daily hot-page refresh

on:
  schedule:
    - cron: '42 18 * * *'
  workflow_dispatch:

jobs:
  refresh-hot-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run refresh:fixtures
      - run: pnpm run validate:data
      - run: pnpm run build
