name: Manual live refresh

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Candidates per shard
        required: false
        default: '20'

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm GitHub PAT can access GraphQL search
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
        run: pnpm exec tsx src/cli.ts token-check --require-graphql-search
      - name: Refresh live data
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
          OSSRANK_LIMIT: ${{ inputs.limit || '20' }}
        run: pnpm run refresh:live
      - run: pnpm run validate:data
      - run: pnpm run build
      - name: Push data to branch and create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date +%Y-%m-%d)
          BRANCH="data/refresh-${DATE}"
          git checkout -B "${BRANCH}"
          git add data
          git diff --cached --stat
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git commit -m "data: manual ossrank live refresh (${DATE})"
          git push origin "${BRANCH}" --force
          # Create or update PR (idempotent — re-creates on the same branch)
          gh pr create \
            --head "${BRANCH}" \
            --base main \
            --title "data: weekly ossrank live refresh (${DATE})" \
            --body "Automated data refresh via manual workflow dispatch. Review and merge." \
            2>/dev/null || gh pr edit "${BRANCH}" \
            --title "data: weekly ossrank live refresh (${DATE})" \
            --body "Automated data refresh via manual workflow dispatch (updated)."
      - name: Deploy refreshed site to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy dist --project-name ossrank
