name: Manual live refresh

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Candidates per shard
        required: false
        default: '20'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Confirm GitHub PAT can access GraphQL search
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
        run: pnpm exec tsx src/cli.ts token-check --require-graphql-search
      - name: Refresh live data
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
          OSSRANK_LIMIT: ${{ inputs.limit || '20' }}
        run: pnpm run refresh:live
      - run: pnpm run validate:data
      - run: pnpm run build
      - name: Commit refreshed data
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: 'data: manual ossrank live refresh'
          file_pattern: 'data'
      - name: Deploy refreshed site to Cloudflare Pages
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: pnpm exec wrangler pages deploy dist --project-name ossrank
