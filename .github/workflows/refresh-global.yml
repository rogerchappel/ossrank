name: Global OSSRank refresh

on:
  schedule:
    - cron: '17 18 * * 3'
  workflow_dispatch:
    inputs:
      limit:
        description: Contributors to publish
        required: false
        default: '20'
      candidate_limit:
        description: New candidates to discover
        required: false
        default: '20'

concurrency:
  group: ossrank-global-refresh
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify the refresh token
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
        run: |
          if [ -z "${OSSRANK_GITHUB_TOKEN}" ]; then
            echo "::error::Required repository secret OSSRANK_GITHUB_TOKEN is not configured."
            exit 1
          fi
          pnpm exec tsx src/cli.ts token-check --require-graphql-search
      - name: Refresh the global contributor board
        env:
          OSSRANK_GITHUB_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
          OSSRANK_LIMIT: ${{ inputs.limit || '20' }}
          OSSRANK_CANDIDATE_LIMIT: ${{ inputs.candidate_limit || '20' }}
        run: pnpm exec tsx src/cli.ts refresh --mode live --scope global --limit "${OSSRANK_LIMIT}" --candidate-limit "${OSSRANK_CANDIDATE_LIMIT}"
      - name: Validate refreshed data
        run: pnpm run validate:data
      - name: Build refreshed site
        run: pnpm run build
      - name: Push the global data branch and create or update its PR
        env:
          GH_TOKEN: ${{ secrets.OSSRANK_GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATE=$(date +%Y-%m-%d)
          BRANCH="data/global-refresh-${DATE}"
          git checkout -B "${BRANCH}"
          BASE_COMMIT=$(git rev-parse HEAD)
          bash .github/scripts/commit-refresh-data.sh "${DATE}" "data: refresh"
          if [ "$(git rev-parse HEAD)" = "${BASE_COMMIT}" ]; then
            echo "No global data changes to publish."
            exit 0
          fi
          git push origin "${BRANCH}" --force

          PR_BODY_FILE=$(mktemp)
          cat > "${PR_BODY_FILE}" <<EOF
          ## Summary

          - Refreshes only the global contributor board with a bounded candidate set.
          - Rechecks the previous top contributors to preserve ranking continuity.
          - Leaves country, language, project, and category snapshots unchanged.

          ## Verification

          - [x] Tests or checks run: live global refresh, data validation, and production build
          - [ ] Manual review completed:

          ## Risk Level

          - [x] Low
          - [ ] Medium
          - [ ] High

          Notes: The site deploys through the existing main-branch deployment workflow after this PR is merged.

          ## Rollback Plan

          - Close this PR without merging, or revert its data commits after merge.

          ## Human Decision Needed

          - [ ] None
          - [x] Maintainer review
          - [ ] Product/design decision
          - [ ] Security/privacy review
          - [ ] Other:
          EOF
          cat "${PR_BODY_FILE}"

          PR_NUMBER=$(gh api "repos/${GITHUB_REPOSITORY}/pulls?head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&base=main&state=open" --jq '.[0].number' 2>/dev/null || true)
          if [ -n "${PR_NUMBER}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}" \
              -f title="data: global ossrank live refresh (${DATE})" \
              -f body="$(<"${PR_BODY_FILE}")"
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/pulls" \
              -f head="${BRANCH}" \
              -f base=main \
              -f title="data: global ossrank live refresh (${DATE})" \
              -f body="$(<"${PR_BODY_FILE}")"
          fi
